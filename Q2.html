<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2 - HTML5 Validations</title>
  <style>
    form { max-width: 400px; margin: 20px auto; font-family: Arial, sans-serif; }
    div { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #28a745; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <form>
    <h2>Student Registration</h2>
    <div>
      <label for="sname">Full Name (Min 3, Max 20 chars):</label>
      <input type="text" id="sname" required minlength="3" maxlength="20">
    </div>
    <div>
      <label for="semail">Email Address:</label>
      <input type="email" id="semail" required>
    </div>
    <div>
      <label for="sroll">Roll Number (Pattern: 2 letters + 4 digits):</label>
      <input type="text" id="sroll" pattern="[A-Za-z]{2}[0-9]{4}" placeholder="e.g. CS1234" required>
    </div>
    <button type="submit">Register</button>
  </form>
</body>
</html>
