<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 18 - Contact Us Layout</title>
  <style>
    .contact-container {
      display: flex;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 30px auto;
      gap: 20px;
      font-family: Arial, sans-serif;
    }
    .form-side, .info-side {
      flex: 1;
      min-width: 280px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 6px;
    }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="contact-container">
    <div class="form-side">
      <h2>Send Message</h2>
      <form>
        <label>Name</label><input type="text">
        <label>Message</label><textarea rows="3"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
    <div class="info-side">
      <h2>Our Office</h2>
      <p><strong>Address:</strong> COER University, Roorkee</p>
      <p><strong>Email:</strong> info@coer.ac.in</p>
      <p><strong>Phone:</strong> +91 1234567890</p>
    </div>
  </div>
</body>
</html>
