<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 5 - Centered Login Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #eef2f3;
      position: relative;
      font-family: Arial, sans-serif;
    }
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .card h2 { margin-top: 0; text-align: center; }
    .card input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .card button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <form>
      <label>Email</label>
      <input type="email" placeholder="user@example.com">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
