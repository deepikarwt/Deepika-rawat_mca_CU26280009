<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 7 - Focus Pseudo Class</title>
  <style>
    form { max-width: 400px; margin: 30px auto; font-family: sans-serif; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 2px solid #ccc;
      border-radius: 4px;
      outline: none;
      transition: all 0.3s ease;
    }
    input:focus, textarea:focus {
      border-color: #28a745;
      background-color: #e8f8f5;
    }
  </style>
</head>
<body>
  <form>
    <h2>Interactive Feedback</h2>
    <label>Your Name:</label>
    <input type="text">
    <label>Comments:</label>
    <textarea rows="4"></textarea>
  </form>
</body>
</html>
