<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 10 - Form Data Table</title>
  <style>
    .form-container { max-width: 600px; margin: 20px auto; font-family: sans-serif; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #333; color: white; }
    tbody tr:nth-child(even) { background-color: #f2f2f2; }
    tbody tr:hover { background-color: #ddd; }
    input { width: 90%; padding: 5px; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Item Entry Table</h2>
    <form>
      <table>
        <thead>
          <tr><th>Item Name</th><th>Quantity</th></tr>
        </thead>
        <tbody>
          <tr><td><input type="text" value="Item A"></td><td><input type="number" value="2"></td></tr>
          <tr><td><input type="text" value="Item B"></td><td><input type="number" value="5"></td></tr>
          <tr><td><input type="text" value="Item C"></td><td><input type="number" value="1"></td></tr>
        </tbody>
      </table>
      <button type="submit">Save Entries</button>
    </form>
  </div>
</body>
</html>
