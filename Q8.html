<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 8 - File Upload & Transitions</title>
  <style>
    form { max-width: 400px; margin: 30px auto; font-family: Arial, sans-serif; }
    .file-input { margin-bottom: 20px; }
    .btn-submit {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }
    .btn-submit:hover {
      background-color: #0056b3;
    }
    .btn-submit:active {
      transform: scale(0.95);
      background-color: #004085;
    }
  </style>
</head>
<body>
  <form>
    <h2>Upload Document</h2>
    <div class="file-input">
      <input type="file">
    </div>
    <button type="submit" class="btn-submit">Submit File</button>
  </form>
</body>
</html>
