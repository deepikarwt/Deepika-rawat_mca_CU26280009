 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 15 - Expanding Search</title>
  <style>
    .search-box {
      margin: 50px auto;
      text-align: center;
    }
    .search-input {
      width: 150px;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 20px;
      outline: none;
      transition: width 0.4s ease-in-out;
    }
    .search-input:focus {
      width: 300px;
      border-color: #007bff;
    }
  </style>
</head>
<body>
  <div class="search-box">
    <input type="text" class="search-input" placeholder="Search...">
  </div>
</body>
</html>
