

<html>
<head>
<title>Survey Form</title>
</head>
<body>
<h1>Student Survey Form</h1>
<form action="/submit-survey" method="post">

  <fieldset>
    <legend>Personal Details</legend>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age"><br>
  </fieldset><br>

  <fieldset>
    <legend>Course Feedback</legend>
    <label for="rating">Overall Rating (1-5):</label>
    <input type="number" id="rating" name="rating" min="1" max="5"><br><br>
    <label for="suggestions">Suggestions:</label><br>
    <textarea id="suggestions" name="suggestions" rows="4" cols="40"></textarea>
  </fieldset><br>

  <input type="submit" value="Submit Survey">
</form>
</body>
